# Example real run: Centropages typicus tau-patches from ECOMON stations,
# with monthly Copernicus physical covariates.
#
# Set paths.zoop_file to your local copy of the database written by
# original/create_database.R. That file is not in this repo and should not be
# committed: data/ is gitignored.
paths:
  project_dir: '.'
  zoop_file: data/zooplankton_database.csv
  output_dir: output/cfin_gom

# Column names as written by original/create_database.R.
columns:
  lat: lat
  lon: lon
  year: year
  month: month
  day: day
  dataset: dataset
  # ECOMON is what this model runs on essentially all of the time. The other
  # values present in the database are ECOMON_STAGED, MBON, and CPR.
  dataset_filter:
    - ECOMON

species:
  active: cfin
  catalog:
    # `column_prefix` is the prefix of the species' columns in the database and
    # defaults to the species key, so cfin and ctyp need it only for clarity.
    # pcal is the one species whose columns are named differently (pseudo_*),
    # so it aliases the preferred name onto the database prefix.
    #
    # `stages` optionally narrows to particular life stages, summed together;
    # omit it to sum every stage (equivalent to the <prefix>_total column).
    # Which stages exist differs per species - cfin resolves CI through CVI,
    # while ctyp and pseudo carry `adult` plus combination columns - so list
    # them with taupatch::available_stages(zoop_file, "cfin") rather than
    # assuming a CI-CVI set.
    #
    # Note for cfin on ECOMON: ECOMON does not resolve CV from CVI and reports
    # the combined count, which this offers as the `adult` stage. Leaving
    # `stages` empty (the default) sums everything and works; selecting single
    # stages only yields data on ECOMON_STAGED.
    cfin:
      column_prefix: cfin
      # stages: [CV, CVI]   # e.g. late copepodites only
      threshold:
        type: percentile
        value: 0.9
    ctyp:
      column_prefix: ctyp
      threshold:
        type: percentile
        value: 0.9
    pcal:
      column_prefix: pseudo
      threshold:
        type: percentile
        value: 0.9

# Observations the model is fitted on.
dates:
  years: [2003, 2017]
  months: [1, 12]

# Northeast US shelf, matching the extent the original pipeline cropped its
# projections to (original/load_covars.R:147).
study_area:
  bbox:
    xmin: -76.0
    xmax: -65.0
    ymin: 35.0
    ymax: 45.0

covariates:
  source: copernicus
  # Covariates are named the way people refer to them; each resolves to a
  # Copernicus product, dataset, and variable via taupatch::copernicus_covariates().
  # Run taupatch::covariate_info() for the full list with units and long names.
  # Covariates sharing a dataset are fetched in a single request.
  selected:
    - SST      # sea surface temperature (degrees C)
    - SSS      # sea surface salinity (PSU)
    - BOTT     # bottom temperature (degrees C)
    - MLD      # mixed layer depth (m)
    - CHL      # chlorophyll-a (mg/m3)
  # Static seafloor covariates, downloaded once from NOAA ETOPO via
  # marmap::getNOAA.bathy() and attached to every month. These replace the
  # SRTM30 depth/slope/distance layers the original used.
  bathymetry:
    - DEPTH
    - SLOPE
  # Per-covariate preparation, applied before the products are joined onto one
  # grid. Without this the join is all-or-nothing: `grid` below decides for
  # every covariate at once. Run taupatch::prejoin_steps() for the step types.
  #
  # CHL is a 4 km satellite retrieval, finer than the 0.083 degree physics and
  # full of cloud gaps; the two steps below fill those gaps from the model
  # equivalent, then aggregate onto the physics grid by averaging real values
  # rather than letting the join interpolate physics down to 4 km. Uncomment
  # CHL_MODEL in `selected` above to use them.
  # prejoin:
  #   - type: fill_gaps
  #     covariate: CHL
  #     from: CHL_MODEL      # consumed, not kept - keep_source: true to retain
  #     rescale: false       # true matches the model's mean/variance first
  #   - type: upscale
  #     covariate: CHL
  #     to: SST              # a covariate's grid, or a number of degrees
  #     method: median       # resists cloud-edge retrieval artifacts
  derived:
    - jday     # day of year; the seasonality term
  # Covariates computed from the grid above rather than downloaded, by the
  # derivoce package. Steps run in order and see what earlier ones produced, so
  # current_speed followed by a gradient of `speed` gives the original
  # pipeline's uv_grad. Run taupatch::derivoce_covariates() for the step types
  # and the column names each produces.
  #
  # Note two things before adding these. Lags and integrals are undefined for
  # the first month of the record, so those stations drop out. And a gradient
  # of a variable that was upsampled from a coarser product describes the
  # source grid rather than the ocean, so check which product is actually
  # coarser before taking a gradient of it - taupatch::covariate_info() gives
  # each one's grid, and a run warns when a gradient reads an upsampled
  # variable.
  derivoce:
    - type: horizontal_gradient
      vars: [SST]            # SST_grad, degrees C per km
    - type: vertical_gradient
      surface: SST
      bottom: BOTT           # SST_BOTT_vgrad; the stratification index
    - type: lag_covariate
      vars: [CHL]
      # Quoted, and it has to be. YAML 1.1 reads a bare `n` as the boolean
      # false, so `n: 1` would name this key FALSE and the step would silently
      # fall back to a one-month lag. taupatch recovers the spelling on read,
      # but quoting keeps the file correct for anything else that opens it.
      "n": 1                 # CHL_lag1; last month's bloom feeds this month
    - type: integrate_covariate
      vars: [CHL]
      window: year           # CHL_int; the original pipeline's int_chl
    # The distance steps below rasterize and run a distance transform per month,
    # which on the 0.083 degree grid is minutes rather than seconds per step,
    # so they are left off by default rather than silently added to every run.
    # distance_to_shore additionally needs the rnaturalearth package.
    # - type: distance_to_front
    #   var: SST               # SST_front_dist, km
    # - type: distance_to_isobath
    #   levels: [50, 100, 200] # isobath_dist_50/100/200; reads DEPTH above
    # - distance_to_shore      # shore_dist, km; the original pipeline's dist
  # The original log-transformed both chlorophyll and bathymetry; both span
  # orders of magnitude across the shelf. Each covariate takes at most one
  # transform. Run taupatch::covariate_transforms() for the full list and what
  # each one can safely be given - in particular, the log/sqrt family takes
  # abs(x) first, which is right for depth (stored negative) and wrong for a
  # signed covariate like a gradient, where yeojohnson is the one to use.
  transform:
    log1p:
      - CHL
      - DEPTH
  # Centring and scaling. Costs a random forest nothing and matters to every
  # other engine, so it stays on unless a run has a reason.
  normalize: true
  # Days fetched in parallel. Modest values only - the bottleneck is the
  # Copernicus API, not local CPU.
  n_workers: 4
  # Test each covariate by refitting without it and seeing how much worse the
  # model ranks stations. Off by default: it is a full cross-validation per
  # covariate, twice over (once leaving it out, once with it alone), which is
  # why `workers` is here. Run taupatch::jackknife_settings() for the block.
  #
  # Read the table it writes to covariate_jackknife.csv before touching `drop`.
  # A covariate that fails this test is one the OTHER covariates already
  # account for, which on a shelf - where depth and temperature carry much of
  # the same information - says as much about collinearity in this sample as
  # about ecology. `drop` is false by default for that reason, and `keep` is
  # for the covariate that is in the model because the study is about it.
  # jackknife:
  #   metric: roc_auc      # or pr_auc; both are threshold-free
  #   criterion: fold      # the corrected paired test across folds, for any
  #                        # model type. `parametric` uses the GLM likelihood
  #                        # ratio / GAM term p-value instead, which only exist
  #                        # for those two types.
  #   alpha: 0.05
  #   adjust: holm         # for having asked the question once per covariate
  #   drop: false          # DEFAULT. Report; never remove on its own.
  #   keep: [DEPTH, jday]  # never dropped, whatever the test says
  #   min_predictors: 2
  #   workers: true        # true = cores - 1; a count; false = sequential

model:
  # rf | brt | glm | gam - taupatch::model_types() describes each.
  # `ensemble` fits several of them and combines their maps; see the block
  # below and taupatch::ensemble_settings().
  type: rf
  trees: 500
  cv_folds: 10
  tune: false
  seed: 42
  # Fit more than one algorithm and average them, rather than picking one and
  # hoping. This is BIOMOD_EnsembleModeling() from the pipeline this package
  # replaces. Set `type: ensemble` above to turn it on with these defaults, or
  # write the block to change them.
  #
  # Note this is a different thing from projection.uncertainty below. That one
  # resamples the data within one algorithm; this one combines across
  # algorithms. Both can be on, and a projection then carries both spreads in
  # separate columns - algorithm_sd against suitability_sd - because a cell can
  # be quiet on one and loud on the other.
  # ensemble:
  #   types: [rf, brt, glm, gam]
  #   rule: weighted_mean  # mean | weighted_mean | median | committee.
  #                        # Every rule is written; this picks which one is the
  #                        # `suitability` layer.
  #   weight_by: tss       # tss | roc_auc | pr_auc | equal, at each member's
  #                        # own optimal cutoff
  #   min_score: 0.4       # members below this are excluded from the average.
  #                        # A low bar on purpose: it is there to catch a
  #                        # member that failed, not to select the best ones.
  #   workers: true
  #   settings:            # per-member overrides of the model block above
  #     gam:
  #       method: REML
  #     brt:
  #       learn_rate: 0.01

projection:
  # Months to map. Omit years/months to reuse the training window; set them to
  # project a different period than the model was fitted on. Covariates are
  # fetched for the union of the two windows.
  years: [2003, 2017]
  months: [1, 12]
  write_geotiff: true
  write_png: true
  overwrite: true
